[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-fantasy-predictor"
version = "0.1.0"
description = "Reproducible, leakage-safe NBA fantasy value projections"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyarrow>=12.0",
  "typer>=0.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "nba_api>=1.4",
  "yahoo_oauth>=2.1",
  "yahoo-fantasy-api>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
fantasy = "fantasy.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["fantasy*"]

